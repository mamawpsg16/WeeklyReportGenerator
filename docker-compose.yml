services:
  report:
    build: .
    volumes:
      - ./prod-log.csv:/data/prod-log.csv
      - ./main.py:/app/main.py
      - ./generate_report.py:/app/generate_report.py
      - ./app.py:/app/app.py
      - ./weekly-report-template.pptx:/app/weekly-report-template.pptx
      - ./output:/output
    environment:
      - CSV_PATH=/data/prod-log.csv
      - GROQ_API_KEY=${GROQ_API_KEY}
      - PRESENTER=Kevin Mensah
    ports:
      - '8501:8501'
    restart: unless-stopped
    command: streamlit run app.py --server.port=8501 --server.address=0.0.0.0
